name: Build Android APK
on: [push, workflow_dispatch]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Base Project Structures
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><title>App</title></head><body></body></html>' > www/index.html
          echo '{"name":"mi-app-apk","version":"1.0.0","private":true}' > package.json

      - name: Install Capacitor Dependencies
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Initialize and Sync Capacitor
        run: |
          npx cap add android
          npx cap sync

      - name: Setup Java Jdk
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
